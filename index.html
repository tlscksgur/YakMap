<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="약-맵: OCR 약 등록, 의약품 전문/일반 판별, 주변 약국/병원 안내, 복약 알림 관리"
    />
    <meta name="theme-color" content="#ff7b68" />
    <title>약맵 | Yak-Map</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero" id="appHero"></header>

      <main id="app" class="content" aria-live="polite"></main>

      <nav class="tabbar" id="appTabbar" aria-label="주요 메뉴" hidden>
        <button class="tab-button is-active" type="button" data-tab="home">
          <span aria-hidden="true">⌂</span>
          홈
        </button>
        <button class="tab-button" type="button" data-tab="meds">
          <span aria-hidden="true">◉</span>
          내약
        </button>
        <button class="tab-button" type="button" data-tab="map">
          <span aria-hidden="true">⌖</span>
          지도
        </button>
        <button class="tab-button" type="button" data-tab="profile">
          <span aria-hidden="true">☻</span>
          프로필
        </button>
      </nav>
    </div>

    <template id="toastTemplate">
      <div class="toast" role="status"></div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
